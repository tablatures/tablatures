<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sample quality: blind test</title>
<style>
	body { font: 16px/1.4 -apple-system, system-ui, sans-serif; margin: 0 auto; max-width: 640px; padding: 16px; color: #171717; }
	h1 { font-size: 20px; } h2 { font-size: 17px; margin: 28px 0 8px; }
	p.note { color: #525252; font-size: 14px; }
	.row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
	.label { width: 1.6em; font-weight: 700; color: #7c3aed; }
	.name { font-size: 13px; color: #525252; min-width: 10em; visibility: hidden; }
	.revealed .name { visibility: visible; }
	audio { flex: 1; min-width: 0; }
	button { font: inherit; padding: 10px 16px; border-radius: 999px; border: 0; background: #7c3aed; color: white; margin-top: 24px; }
</style>
</head>
<body>
<h1>Is it the samples?</h1>
<p class="note">The same riff four ways, loudness-matched and shuffled. Three go through the identical amp, cabinet and mix chain and differ only in the guitar samples feeding it. One is today's Studio sound for reference. Pick the best and the worst, then reveal. Headphones help.</p>
<div id="clips"></div>
<button id="reveal">Reveal</button>
<script>
	const versions = { studio: 'Studio today (no amp chain)', musescore: 'Amp chain + MuseScore clean guitar (10 samples)', green: 'Amp chain + Karoryfer green Gretsch (CC0, multi-sampled)', black: 'Amp chain + Karoryfer black Hofner (CC0, multi-sampled)' };
	const clips = { rock: 'Distorted riff, bass, drums' };
	const root = document.getElementById('clips');
	for (const [clip, title] of Object.entries(clips)) {
		const h = document.createElement('h2');
		h.textContent = title;
		root.append(h);
		Object.keys(versions).sort(() => Math.random() - 0.5).forEach((v, i) => {
			const row = document.createElement('div');
			row.className = 'row';
			row.innerHTML = `<span class="label">${'ABCD'[i]}</span><audio controls preload="none" src="${clip}-${v}.mp3"></audio><span class="name">${versions[v]}</span>`;
			root.append(row);
		});
	}
	document.addEventListener('play', (e) => { for (const a of document.querySelectorAll('audio')) if (a !== e.target) a.pause(); }, true);
	document.getElementById('reveal').onclick = () => document.body.classList.toggle('revealed');
</script>
</body>
</html>
