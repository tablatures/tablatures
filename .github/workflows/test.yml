name: Tests

# The regression gate: type-check + unit + Playwright e2e. Runs on every push
# and every PR (including stacked PRs), and is reusable (workflow_call) so the release workflows can
# require it before building/publishing anything.
#
# The e2e suite is sharded across parallel jobs and the layout suite runs in its
# own job, so wall time is bounded by the slowest shard rather than the sum.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

  layout:
    name: Layout shifts (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Browsers and their system deps come preinstalled; keep the tag in step
    # with @playwright/test in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright browsers
        uses: ./.github/actions/playwright-browsers

      - name: Zero layout shifts (production build)
        run: pnpm test:layout --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload layout report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report-${{ matrix.shard }}
          path: layout-test-results/
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Browsers and their system deps come preinstalled; keep the tag in step
    # with @playwright/test in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright browsers
        uses: ./.github/actions/playwright-browsers

      # Deal tests out round-robin instead of Playwright's contiguous --shard
      # blocks, which hand whole playback-heavy files to the same shard.
      - name: Pick this shard's tests
        run: |
          pnpm exec playwright test --list | sed -n 's/^  //p' |
            awk -v n=${{ strategy.job-total }} -v i=${{ matrix.shard }} '(NR - 1) % n == i - 1' > shard-tests.txt
          wc -l < shard-tests.txt

      - name: E2E tests (Playwright)
        run: pnpm test:e2e --test-list shard-tests.txt
        env:
          # The dev server the e2e suite boots reads this; requests are mocked in
          # the specs, so any base works. A local URL keeps unmocked calls from
          # reaching the network.
          VITE_SEARCH_API_BASE_URL: http://localhost:3000
          VITE_SEARCH_API_TIMEOUT: '10000'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single status to depend on (callers' `needs: test`, branch protection),
  # independent of how many shards the suite is split into.
  test:
    name: All tests
    if: always()
    needs: [static, layout, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        run: |
          [ "${{ needs.static.result }}" = success ] &&
          [ "${{ needs.layout.result }}" = success ] &&
          [ "${{ needs.e2e.result }}" = success ]
